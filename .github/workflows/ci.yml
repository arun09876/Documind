name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: documind
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U documind" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://documind:documind@localhost:5432/documind
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      # Includes the retrieval evaluation, which runs with the real embedding model.
      - run: python manage.py test
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
